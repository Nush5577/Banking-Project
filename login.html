<html>
<head>
    <title>Login</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='styleATM.css') }}">
</head>

<body>
    <h1>Welcome to ATM System</h1>

    <form action="/login" method="POST">
		<table id = "tblinput">

			<tr>
				<td> <h2>Login</h2></td>
				
			</tr>
			<tr>
				<td>
					<table id = "tblinfo">
				
						<tr>
							<td><label id="lblfname">User Name </label><br>
								<input type="text" name="txtusername" required>
							</td>
							
						</tr>
						<tr>
						
							<td><label id="lblpass">Password </label><br>
								<input type="password" name="txtpass" required></td>
						</tr>
						<tr>
							<td><button type = "submit" id="btnlogin" name="btnlogin">Log in</button> <br>
								<button type = "reset" id="btnforgot" name="btnforgot">Forgot password</button><br>
								<a href="{{ url_for('useraccount') }}"><button type = "button" id="btncreateacc" name="btncreateacc">Create account</button></a></td>
						</tr>
					</table>
				</td>
			</tr>
			
		</table>
        
    </form>

</body>
</html>
